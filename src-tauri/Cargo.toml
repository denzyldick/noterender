[package]
name = "noterender"
version = "0.1.0"
edition = "2021"

[lib]
name = "noterender_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "noterender"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
rustfft = "6"
parking_lot = "0.12"
once_cell = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
