name: Build and Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: noterender-linux.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: noterender-windows.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: noterender-macos.tar.gz
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('native/Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-cargo-

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        working-directory: native

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p noterender
          cp target/${{ matrix.target }}/release/noterender noterender/
          cp -r assets noterender/
          tar czf ${{ matrix.artifact }} noterender/
        working-directory: native

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p noterender
          cp target/${{ matrix.target }}/release/noterender noterender/
          cp -r assets noterender/
          tar czf ${{ matrix.artifact }} noterender/
        working-directory: native

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir noterender
          cp target/${{ matrix.target }}/release/noterender.exe noterender/
          cp -r assets noterender/
          7z a ${{ matrix.artifact }} noterender/
        working-directory: native

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: native/${{ matrix.artifact }}
