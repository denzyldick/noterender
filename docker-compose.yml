services:
  db:
    image: postgres:16-alpine
    container_name: noterender_db
    environment:
      POSTGRES_DB: noterender
      POSTGRES_USER: noterender
      POSTGRES_PASSWORD: noterender
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noterender -d noterender"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  noterender-api:
    build:
      context: ../noterender-api
      dockerfile: Dockerfile
    container_name: noterender_api
    ports:
      - "8000:80"
    volumes:
      - ../noterender-api/env.local.file:/app/.env.local:ro
    environment:
      APP_ENV: prod
      SERVER_NAME: localhost
      DATABASE_URL: postgresql://noterender:noterender@db:5432/noterender?serverVersion=16&charset=utf8
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  rtmp-relay:
    image: node:20-alpine
    container_name: noterender_rtmp_relay
    working_dir: /app
    volumes:
      - ../noterender-api/rtmp-relay:/app
    command: sh -c "apk add --no-cache ffmpeg && npm install --omit=dev && node server.js"
    environment:
      RELAY_HOST: 0.0.0.0
      RELAY_PORT: 8090
    ports:
      - "8090:8090"
    restart: unless-stopped

  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: noterender_frontend_dev
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - noterender-api
    environment:
      - NODE_ENV=development
      - VUE_APP_API_URL=http://localhost:8000
    stdin_open: true
    tty: true

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: noterender_frontend
    ports:
      - "80:80"
    depends_on:
      - noterender-api
    restart: unless-stopped

volumes:
  db_data: